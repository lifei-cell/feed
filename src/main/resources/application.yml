spring:
  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:4}
      thread-name-prefix: feed-scheduling-
  application:
    name: friend-feed
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/feed?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${MYSQL_USER:feed}
    password: ${MYSQL_PASSWORD:feed}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
      properties:
        default.api.timeout.ms: 10000
        request.timeout.ms: 10000
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        max.block.ms: 10000
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:friend-feed-fanout-v1}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      observation-enabled: true
    template:
      observation-enabled: true
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_FILE_SIZE:20MB}
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:25MB}

feed:
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:false}
  page:
    default-size: 20
    max-size: 100
    scan-factor: 3
    max-scan-rounds: 10
  fanout:
    topic: ${FANOUT_TOPIC:feed.post-published.v1}
    dlt-topic: ${FANOUT_DLT_TOPIC:feed.post-published.v1.DLT}
    dlt-consumer-group: ${FANOUT_DLT_CONSUMER_GROUP:friend-feed-fanout-dlt-governance-v1}
    dlt-capture-retry-delay: ${FANOUT_DLT_CAPTURE_RETRY_DELAY:5s}
    kafka-retry:
      attempts: ${FANOUT_KAFKA_RETRY_ATTEMPTS:2}
      backoff: ${FANOUT_KAFKA_RETRY_BACKOFF:1s}
    dispatch-delay-ms: 300
    recovery-delay-ms: 10000
    batch-size: 50
    max-attempts: 8
    initial-backoff: 1s
    max-backoff: 15m
    processing-timeout: 2m
    send-timeout: 10s
    auto-policy:
      enabled: ${FANOUT_AUTO_ENABLED:true}
      pull-threshold: ${FANOUT_AUTO_PULL_THRESHOLD:10000}
      push-threshold: ${FANOUT_AUTO_PUSH_THRESHOLD:8000}
      batch-size: ${FANOUT_AUTO_BATCH_SIZE:500}
      max-batches: ${FANOUT_AUTO_MAX_BATCHES:20}
      initial-delay-ms: ${FANOUT_AUTO_INITIAL_DELAY_MS:15000}
      delay-ms: ${FANOUT_AUTO_DELAY_MS:60000}
    backfill:
      batch-size: ${FANOUT_BACKFILL_BATCH_SIZE:500}
      max-batches-per-run: ${FANOUT_BACKFILL_MAX_BATCHES_PER_RUN:10}
      processing-timeout: ${FANOUT_BACKFILL_PROCESSING_TIMEOUT:5m}
      initial-delay-ms: ${FANOUT_BACKFILL_INITIAL_DELAY_MS:5000}
      delay-ms: ${FANOUT_BACKFILL_DELAY_MS:1000}
  cache:
    post-ttl: 10m
    author-timeline-ttl: ${AUTHOR_TIMELINE_CACHE_TTL:5m}
    author-timeline-max-entries: ${AUTHOR_TIMELINE_CACHE_MAX_ENTRIES:500}
  shadow:
    enabled: ${FEED_SHADOW_ENABLED:true}
    sample-rate: ${FEED_SHADOW_SAMPLE_RATE:0.1}
  media:
    storage-path: ${MEDIA_STORAGE_PATH:./data/media}
    storage-type: ${MEDIA_STORAGE_TYPE:LOCAL}
    max-file-size: ${MEDIA_MAX_FILE_SIZE:20MB}
    max-attachments-per-post: 9
    upload-url-ttl: ${MEDIA_UPLOAD_URL_TTL:10m}
    download-url-ttl: ${MEDIA_DOWNLOAD_URL_TTL:5m}
    unattached-retention: ${MEDIA_UNATTACHED_RETENTION:24h}
    cleanup-delay-ms: ${MEDIA_CLEANUP_DELAY_MS:3600000}
    cleanup-batch-size: ${MEDIA_CLEANUP_BATCH_SIZE:100}
    preview:
      width: ${MEDIA_PREVIEW_WIDTH:1280}
      batch-size: ${MEDIA_PREVIEW_BATCH_SIZE:10}
      max-attempts: ${MEDIA_PREVIEW_MAX_ATTEMPTS:3}
      processing-timeout: ${MEDIA_PREVIEW_PROCESSING_TIMEOUT:10m}
      initial-delay-ms: ${MEDIA_PREVIEW_INITIAL_DELAY_MS:10000}
      delay-ms: ${MEDIA_PREVIEW_DELAY_MS:2000}
      ffmpeg-path: ${MEDIA_FFMPEG_PATH:ffmpeg}
      ffmpeg-timeout: ${MEDIA_FFMPEG_TIMEOUT:2m}
    s3:
      enabled: ${MEDIA_S3_ENABLED:false}
      endpoint: ${MEDIA_S3_ENDPOINT:}
      public-endpoint: ${MEDIA_S3_PUBLIC_ENDPOINT:}
      region: ${MEDIA_S3_REGION:us-east-1}
      bucket: ${MEDIA_S3_BUCKET:friend-feed-media}
      access-key: ${MEDIA_S3_ACCESS_KEY:}
      secret-key: ${MEDIA_S3_SECRET_KEY:}
      path-style: ${MEDIA_S3_PATH_STYLE:true}
      auto-create-bucket: ${MEDIA_S3_AUTO_CREATE_BUCKET:false}
  security:
    jwt:
      mode: ${JWT_MODE:HMAC}
      issuer: ${JWT_ISSUER:https://friend-feed.local}
      audience: ${JWT_AUDIENCE:}
      user-id-claim: ${JWT_USER_ID_CLAIM:sub}
      roles-claim: ${JWT_ROLES_CLAIM:roles}
      secret: ${JWT_SECRET:local-development-secret-change-before-production}
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}
      private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}
      jwk-set-uri: ${JWT_JWK_SET_URI:}
      key-id: ${JWT_KEY_ID:friend-feed-1}
      ttl: ${JWT_TTL:15m}
    refresh-token:
      ttl: ${REFRESH_TOKEN_TTL:30d}
      cookie:
        name: ${REFRESH_COOKIE_NAME:ff-refresh}
        path: /api/auth
        domain: ${REFRESH_COOKIE_DOMAIN:}
        secure: ${REFRESH_COOKIE_SECURE:false}
        same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
    session-retention: ${AUTH_SESSION_RETENTION:7d}
    session-cleanup-initial-delay-ms: 300000
    session-cleanup-delay-ms: 86400000
    login-rate-limit:
      account-max-attempts: ${LOGIN_ACCOUNT_MAX_ATTEMPTS:5}
      address-max-attempts: ${LOGIN_ADDRESS_MAX_ATTEMPTS:20}
      window: ${LOGIN_RATE_WINDOW:15m}
      block-duration: ${LOGIN_BLOCK_DURATION:15m}

server:
  port: ${SERVER_PORT:8080}

logging:
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:logstash}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:${SERVER_PORT:8080}}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      export:
        enabled: ${OTLP_TRACING_ENABLED:false}
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
