name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Verify committed frontend assets
        working-directory: .
        run: git diff --exit-code -- src/main/resources/static
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -DskipITs verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: target/site/jacoco
          if-no-files-found: ignore

  infrastructure-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run MySQL and Kafka integration tests
        run: mvn -B verify

  compose-e2e:
    runs-on: ubuntu-latest
    needs: [frontend-quality, backend-unit, infrastructure-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: mvn -B -DskipTests package
      - name: Validate production Compose and alert rules
        run: |
          docker compose --profile observability config -q
          docker run --rm -v "$PWD/monitoring:/work:ro" --entrypoint promtool prom/prometheus:v3.5.0 check rules /work/alerts.yml
          docker run --rm -v "$PWD/monitoring:/work:ro" --entrypoint amtool prom/alertmanager:v0.28.1 check-config /work/alertmanager.yml
          docker run --rm -v "$PWD/monitoring:/work:ro" otel/opentelemetry-collector-contrib:0.130.1 validate --config=/work/otel-collector.yml
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run Compose smoke and browser E2E
        env:
          RUN_E2E: "true"
          COMPOSE_PROJECT_NAME: friend-feed-ci-${{ github.run_id }}
          JWT_SECRET: ci-only-secret-with-at-least-32-random-bytes
        run: bash scripts/compose-smoke.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-e2e-diagnostics
          path: |
            compose-smoke.log
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
