services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      MYSQL_URL: jdbc:mysql://mysql:3306/feed?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      MYSQL_USER: feed
      MYSQL_PASSWORD: feed
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-production}
      JWT_TTL: ${JWT_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-30d}
      AUTH_SESSION_RETENTION: ${AUTH_SESSION_RETENTION:-7d}
      LOGIN_ACCOUNT_MAX_ATTEMPTS: ${LOGIN_ACCOUNT_MAX_ATTEMPTS:-5}
      LOGIN_ADDRESS_MAX_ATTEMPTS: ${LOGIN_ADDRESS_MAX_ATTEMPTS:-20}
      LOGIN_RATE_WINDOW: ${LOGIN_RATE_WINDOW:-15m}
      LOGIN_BLOCK_DURATION: ${LOGIN_BLOCK_DURATION:-15m}
      VERIFICATION_EMAIL_WEBHOOK_URL: ${VERIFICATION_EMAIL_WEBHOOK_URL:-}
      VERIFICATION_SMS_WEBHOOK_URL: ${VERIFICATION_SMS_WEBHOOK_URL:-}
      VERIFICATION_WEBHOOK_TOKEN: ${VERIFICATION_WEBHOOK_TOKEN:-}
      VERIFICATION_TTL: ${VERIFICATION_TTL:-10m}
      VERIFICATION_RESEND_COOLDOWN: ${VERIFICATION_RESEND_COOLDOWN:-60s}
      VERIFICATION_MAX_ATTEMPTS: ${VERIFICATION_MAX_ATTEMPTS:-5}
      VERIFICATION_LOG_CODE: ${VERIFICATION_LOG_CODE:-false}
      MEDIA_STORAGE_PATH: /app/data/media
      MEDIA_STORAGE_TYPE: ${MEDIA_STORAGE_TYPE:-S3}
      MEDIA_S3_ENABLED: ${MEDIA_S3_ENABLED:-true}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:-http://minio:9000}
      MEDIA_S3_PUBLIC_ENDPOINT: ${MEDIA_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-us-east-1}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-friend-feed-media}
      MEDIA_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-feed-minio}
      MEDIA_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-feed-minio-secret}
      MEDIA_S3_PATH_STYLE: ${MEDIA_S3_PATH_STYLE:-true}
      MEDIA_S3_AUTO_CREATE_BUCKET: ${MEDIA_S3_AUTO_CREATE_BUCKET:-true}
      MEDIA_UNATTACHED_RETENTION: ${MEDIA_UNATTACHED_RETENTION:-24h}
      MEDIA_PREVIEW_MAX_ATTEMPTS: ${MEDIA_PREVIEW_MAX_ATTEMPTS:-3}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}
      FANOUT_AUTO_ENABLED: ${FANOUT_AUTO_ENABLED:-true}
      FANOUT_AUTO_PULL_THRESHOLD: ${FANOUT_AUTO_PULL_THRESHOLD:-10000}
      FANOUT_AUTO_PUSH_THRESHOLD: ${FANOUT_AUTO_PUSH_THRESHOLD:-8000}
      FANOUT_BACKFILL_BATCH_SIZE: ${FANOUT_BACKFILL_BATCH_SIZE:-500}
      FANOUT_BACKFILL_MAX_BATCHES_PER_RUN: ${FANOUT_BACKFILL_MAX_BATCHES_PER_RUN:-10}
      FANOUT_BACKFILL_PROCESSING_TIMEOUT: ${FANOUT_BACKFILL_PROCESSING_TIMEOUT:-5m}
      FANOUT_BACKFILL_INITIAL_DELAY_MS: ${FANOUT_BACKFILL_INITIAL_DELAY_MS:-5000}
      FANOUT_BACKFILL_DELAY_MS: ${FANOUT_BACKFILL_DELAY_MS:-1000}
      AUTHOR_TIMELINE_CACHE_TTL: ${AUTHOR_TIMELINE_CACHE_TTL:-5m}
      AUTHOR_TIMELINE_CACHE_MAX_ENTRIES: ${AUTHOR_TIMELINE_CACHE_MAX_ENTRIES:-500}
      FEED_SHADOW_ENABLED: ${FEED_SHADOW_ENABLED:-true}
      FEED_SHADOW_SAMPLE_RATE: ${FEED_SHADOW_SAMPLE_RATE:-1.0}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - media-data:/app/data/media
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: feed
      MYSQL_USER: feed
      MYSQL_PASSWORD: feed
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-feed-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-feed-minio-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-http://localhost:8080,http://localhost:5173}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  media-data:
  minio-data:
